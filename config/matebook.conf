#!/usr/bin/env bash
# arch-bootstrap preset — Huawei MateBook D16 2021 (AMD Ryzen 5 4600H)
#
# Hardware:
#   CPU   AMD Ryzen 5 4600H (Renoir, integrated Radeon RX Vega 6)
#   RAM   16 GB
#   SSD   NVMe (select disk interactively at install time)
#
# Software stack:
#   DE    Niri (Wayland / greetd)        — inherited from default
#   Audio PipeWire                        — inherited from default
#   Net   NetworkManager + BlueZ          — inherited from default

# Role — desktop (graphical session stack, see config/desktop.conf)
# shellcheck source=config/desktop.conf
source "${BASH_SOURCE[0]%/*}/desktop.conf"

# System identity
HOSTNAME="matebook"

# Base packages — append AMD microcode to the default list
# Use += to extend the array from default.conf rather than replacing it.
BASE_PACKAGES+=(
    "amd-ucode"
)

# Disk partitioning
SWAP_TYPE="partition"
SWAP_SIZE="16G"

# Machine-specific packages — AMD open-source GPU stack
# All common packages (Niri, audio, bluetooth, ufw, fwupd, …) come from
# default.conf and are already present in PACKAGES before this preset is
# sourced; we only append hardware-specific additions here.
PACKAGES+=(
    # GPU — AMD integrated (Vega 6, open-source stack)
    # hooks/amdgpu.sh adds amdgpu to mkinitcpio for early KMS.
    # Ref: https://wiki.archlinux.org/title/AMDGPU#Early_KMS_start
    "mesa:amdgpu"
    "vulkan-radeon"

    # Wi-Fi stack (per-host, see the Network section of default.conf):
    # iwd — NetworkManager backend with WPA3-SAE (wired via hooks/iwd.sh);
    # wireless-regdb — kernel regulatory.db, else world domain (country 00)
    "iwd"
    "wireless-regdb"
)

# Kernel parameters
KERNEL_PARAMS+=(
    # AMD SMBus: firmware ACPI tables reserve the piix4 SMBus region, so the
    # i2c-piix4 driver conflicts with ACPI and fails to bind (SMBus timeouts
    # at boot). Platform-specific (Huawei MateBook AMD firmware), not a CPU
    # generation trait — do not copy to other hosts without the symptom.
    # Ref: https://wiki.gentoo.org/wiki/Huawei_MateBook_D_15_AMD_2019
    "acpi_enforce_resources=lax"
)

# Sleep / hibernate
# Hibernate automatically after 4 hours of suspend.
# Configures HibernateDelaySec and logind lid behaviour
# (via chroot/modules/08-sleep.sh).
HIBERNATE_DELAY="4h"
