#!/usr/bin/env bash
# arch-bootstrap default configuration preset
# Copy this file, adjust values, and pass it to bootstrap.sh:
#   bash bootstrap.sh --config /path/to/my.conf

# Localization
LOCALES=("en_US.UTF-8" "ru_RU.UTF-8")
LANG="en_US.UTF-8"
KEYMAP="ruwin_alt_sh-UTF-8"
FONT="cyr-sun16"
# Optional X11/Wayland keyboard layout exported to /etc/vconsole.conf for
# graphical login/session tools that read XKBLAYOUT and XKBOPTIONS.
XKBLAYOUT="us,ru"
# caps toggles the layout (with LED indication), right Alt is the compose key
XKBOPTIONS="grp:caps_toggle,grp_led:caps,compose:ralt"

# Disk partitioning
# Set DISK to a device path (e.g. /dev/sda, /dev/nvme0n1) to skip interactive
# selection, or leave empty to be prompted at runtime.
#
# FILESYSTEM: "btrfs" — btrfs root with subvolumes (@, @home, @log, @pkg,
#                       @snapshots) mounted with noatime,compress=zstd (default)
#             "ext4"  — plain ext4 root
#
# SWAP_TYPE: "file"      — create a swapfile at /swap/swapfile
#            "partition" — create a dedicated swap partition
#            "none"      — no swap
#            ""          — prompt at runtime (default)
# SWAP_SIZE: swap size (e.g. "16G", "4096M"); used only when SWAP_TYPE != none.
#            Must be explicitly set when SWAP_TYPE is "file" or "partition" in a preset/config.
DISK=""
FILESYSTEM="btrfs"
SWAP_TYPE=""
SWAP_SIZE=""

# Mirrors
# Reflector arguments — the single source of truth used twice:
#   1. install time — modules/03-mirrors.sh ranks mirrors with these args;
#   2. installed system — hooks/reflector.sh writes them verbatim to
#      /etc/xdg/reflector/reflector.conf and enables reflector.timer.
# One argument (with its value) per array element; --save is appended
# automatically in both places.
# Pipeline: official MirrorStatus (HTTPS) -> reliability/freshness filter ->
# regional pool -> rank by real download rate.
# Ref: https://wiki.archlinux.org/title/Reflector
REFLECTOR_ARGS=(
    "--protocol https"
    "--country Russia,Finland,Germany,Netherlands"
    "--completion-percent 100"
    "--age 12"
    "--latest 30"
    "--sort rate"
    "--number 10"
    "--connection-timeout 5"
    "--download-timeout 10"
)

# System identity
HOSTNAME="archlinux"

# Note: username, user password, and root password are always collected
# interactively at the start of bootstrap.sh. They are never defined in
# preset files; they are serialised into the chroot config at runtime.

# Packages
# Each entry is a package name optionally followed by a post-install
# configuration script (relative to hooks/).
# Format: "package_name[:hook_script]"
# If hooks/<package_name>.sh exists it is run automatically even without the
# explicit ":hook" suffix.
#
# In preset files, extend these arrays with += rather than redefining them,
# so that default packages are preserved:
#   BASE_PACKAGES+=("amd-ucode")
#   PACKAGES+=("mesa" "vulkan-radeon")
BASE_PACKAGES=(
    "base"
    "base-devel"
    "linux"
    "linux-firmware"
)

PACKAGES=(
    # Editors
    "nano"
    "neovim"
    "vim"

    # Utilities
    "openssh"
    "git"
    "sudo"
    "reflector"
    # hooks/pacman-contrib.sh enables the weekly paccache.timer
    "pacman-contrib"
    "bash-completion"
    "man-db"
    "man-pages"
    "texinfo"

    # Network
    "networkmanager"
    "ethtool"
    # Wi-Fi stack (iwd + wireless-regdb) is per-host, not default: wired-only
    # machines (e.g. the station) must not carry it and presets can only
    # append. Add to the host preset: PACKAGES+=("iwd" "wireless-regdb");
    # hooks/iwd.sh then wires it as NetworkManager's backend automatically.

    # Bluetooth
    "bluez"
    "bluez-utils"
    # TUI Bluetooth manager — works everywhere incl. headless hosts
    "bluetui"

    # Audio (PipeWire stack)
    "pipewire"
    "pipewire-alsa"
    "pipewire-pulse"
    "pipewire-libcamera"
    "wireplumber"

    # Desktop session (greetd + niri + Wayland tooling), boot splash,
    # browsers and other GUI-only packages live in the desktop ROLE LAYER —
    # config/desktop.conf — which desktop presets source explicitly.
    # Headless/server hosts (e.g. the station) source config/server.conf
    # instead and never carry the graphical stack.

    # Power management
    # hooks/tlp.sh enables tlp.service; tlp-rdw.sh enables the
    # NetworkManager dispatcher; tlp-pd.sh runs for tlp-pd
    "tlp"
    "tlp-rdw"
    "tlp-pd"

    # Disk health / SMART tooling
    "smartmontools"

    # Firmware updates
    "fwupd"

    # Onboard audio firmware (Sound Open Firmware — required on most modern
    # Intel and AMD systems for onboard audio that is not covered by linux-firmware)
    # Ref: https://wiki.archlinux.org/title/Installation_guide#Install_essential_packages
    "sof-firmware"

    # System monitor
    "btop"

    # Container runtime — hooks/docker.sh adds the user to the docker group,
    # which grants access to the privileged Docker socket and is effectively
    # root-equivalent on the host.
    # docker-compose provides the standalone Compose v2 command.
    # Ref: https://wiki.archlinux.org/title/Docker
    "docker"
    "docker-compose"
)

# AUR helper — yay
# Packages to install from the AUR via yay after the main installation.
YAY_PACKAGES=(
    # (google-chrome is GUI-only — lives in config/desktop.conf)
    # nvm hook adds NVM source lines to the user's shell profile files
    "nvm"
)

# Kernel parameters
# Extra parameters appended to the kernel command line.
# In preset files, extend with += to preserve defaults:
#   KERNEL_PARAMS+=("nvidia_drm.modeset=1")
KERNEL_PARAMS=()

# Bootloader — systemd-boot
# EFI_MOUNTPOINT: where the ESP is mounted (default: /boot)
EFI_MOUNTPOINT="/boot"

# Services
# For services not tied to a specific package in PACKAGES (e.g. built-in
# systemd timers). Package-specific service enabling belongs in the package's
# hook script (hooks/<name>.sh).
# Each entry is passed to: systemctl enable <unit>
SERVICES=(
    # fstrim.timer: periodic TRIM for SSD longevity. Part of util-linux (base
    # system), not a PACKAGES entry, so it lives here rather than in a hook.
    "fstrim.timer"
)

# Sleep / hibernate
# Set to a systemd timespan (e.g. "4h") to enable suspend-then-hibernate:
# the system will suspend normally and hibernate after this delay.
# Leave empty to keep standard suspend behaviour.
HIBERNATE_DELAY=""
