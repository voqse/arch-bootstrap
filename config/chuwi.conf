#!/usr/bin/env bash
# arch-bootstrap preset — CHUWI UBox (AMD Ryzen 5 6600H)
#
# Hardware:
#   CPU   AMD Ryzen 5 6600H (Rembrandt, integrated Radeon 660M / RDNA2)
#   RAM   16 GB LPDDR5-6400 (4-channel)
#   SSD   NVMe Gen3 x4, 512 GB
#   NET   2x Realtek RTL8111 (1 GbE, in-kernel r8169), Wi-Fi + BT
#
# Role: bedroom desktop — local dev terminal + Moonlight client for the
# workstation (Wolf host).
#
# Software stack:
#   DE    Niri (Wayland / greetd)        — inherited from default
#   Audio PipeWire                        — inherited from default
#   Net   NetworkManager + BlueZ          — inherited from default

# System identity
HOSTNAME="chuwi"

# Base packages — append AMD microcode to the default list
BASE_PACKAGES+=(
    "amd-ucode"
)

# Disk partitioning
SWAP_TYPE="partition"
SWAP_SIZE="16G"

# Machine-specific packages — AMD open-source GPU stack
# All common packages come from default.conf; only hardware/role-specific
# additions live here.
PACKAGES+=(
    # GPU — AMD integrated (Radeon 660M, open-source stack)
    # hooks/amdgpu.sh adds amdgpu to mkinitcpio for early KMS.
    # Ref: https://wiki.archlinux.org/title/AMDGPU#Early_KMS_start
    "mesa:amdgpu"
    "vulkan-radeon"
    # VA-API — hardware video decode, required for smooth Moonlight streaming
    "libva-mesa-driver"

    # Game/desktop streaming client (Wolf/Sunshine host on the workstation)
    "moonlight-qt"

    # Wi-Fi stack (per-host, see the Network section of default.conf):
    # iwd — NetworkManager backend with WPA3-SAE (wired via hooks/iwd.sh);
    # wireless-regdb — kernel regulatory.db, else world domain (country 00)
    "iwd"
    "wireless-regdb"

    # Boot splash (per-host, see default.conf) — hooks/plymouth.sh wires
    # mkinitcpio and the 'splash' kernel flag
    "plymouth"

    # Desktop session (per-host, see the PACKAGES note in default.conf)
    # Wayland session + greeter; hooks/greetd.sh runs automatically
    "greetd"
    "niri"
    "fuzzel"
    "swaync"
    "xdg-desktop-portal-gtk"
    "xdg-desktop-portal-gnome"
    "ghostty"
    "swaybg"
    "swayidle"
    "swaylock"
    "xwayland-satellite"
    # Wayland clipboard CLI (wl-copy/wl-paste) — nvim, scripts, terminal workflows
    "wl-clipboard"
    "udiskie"
    "nautilus"
    "gnome-keyring"
    "seahorse"

    # GUI-only extras
    "firefox"
    "gufw"
)

# AUR — GUI-only, on top of default's list
YAY_PACKAGES+=(
    "google-chrome"
)

# Sleep / hibernate
# No battery in this box, so hibernate never rescues a dying charge the way
# it does on the laptop — but keep the policy symmetric with matebook.conf:
# suspend still happens (idle), and hibernate after 4 hours frees RAM/power
# identically across the fleet.
HIBERNATE_DELAY="4h"
