#!/usr/bin/env bash
# arch-install role layer — desktop
# Shared graphical stack for desktop hosts, kept out of default.conf so that
# server/headless hosts (e.g. the station) never carry it. Host presets opt
# in near the top, before their own additions:
#   source "${BASH_SOURCE[0]%/*}/desktop.conf"
# default.conf is always sourced first by run.sh, so += here extends
# the default arrays like any preset.

PACKAGES+=(
    # Boot splash — hooks/plymouth.sh wires mkinitcpio and the 'splash'
    # kernel flag
    "plymouth"

    # Wayland session + greeter; hooks/greetd.sh runs automatically and
    # configures autologin for the bootstrap user
    "greetd"
    "niri"
    "fuzzel"
    "swaync"
    "xdg-desktop-portal-gtk"
    "xdg-desktop-portal-gnome"
    "ghostty"
    "swayidle"
    "swaylock"
    "xwayland-satellite"
    # Wayland clipboard CLI (wl-copy/wl-paste) — nvim, scripts, terminal
    # workflows; useless without a compositor, hence desktop-only
    "wl-clipboard"
    "nautilus"
    "gnome-keyring"
    "seahorse"
    # Polkit authentication agent — polkitd alone cannot prompt; without an
    # agent in the session GUI privilege requests fail silently. GTK-based,
    # no Qt pull-in; the niri config spawns
    # /usr/lib/mate-polkit/polkit-mate-authentication-agent-1 at startup.
    "mate-polkit"
    # MPRIS CLI — the niri config binds XF86 media keys to playerctl
    "playerctl"

    # Fonts — ghostty is configured with Iosevka (AUR, below); JetBrains Mono
    # is the kept alternative. Nerd symbols are a symbols-only fallback font:
    # LazyVim UI glyphs live in the Nerd private-use area and plain Iosevka
    # lacks them. Noto emoji is the emoji fallback for browsers/notifications.
    "ttf-jetbrains-mono"
    "ttf-nerd-fonts-symbols"
    "noto-fonts-emoji"

    # GUI-only extras
    "firefox"
)

# AUR — GUI-only
YAY_PACKAGES+=(
    "google-chrome"
    # Primary terminal font (see the Fonts block above)
    "ttf-iosevka"
)
