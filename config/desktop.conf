#!/usr/bin/env bash
# arch-bootstrap role layer — desktop
# Shared graphical stack for desktop hosts, kept out of default.conf so that
# server/headless hosts (e.g. the station) never carry it. Host presets opt
# in near the top, before their own additions:
#   source "${BASH_SOURCE[0]%/*}/desktop.conf"
# default.conf is always sourced first by bootstrap.sh, so += here extends
# the default arrays like any preset.

PACKAGES+=(
    # Boot splash — hooks/plymouth.sh wires mkinitcpio and the 'splash'
    # kernel flag
    "plymouth"

    # Wayland session + greeter; hooks/greetd.sh runs automatically and
    # configures autologin for the bootstrap user
    "greetd"
    "niri"
    "fuzzel"
    "swaync"
    "xdg-desktop-portal-gtk"
    "xdg-desktop-portal-gnome"
    "ghostty"
    "swayidle"
    "swaylock"
    "xwayland-satellite"
    # Wayland clipboard CLI (wl-copy/wl-paste) — nvim, scripts, terminal
    # workflows; useless without a compositor, hence desktop-only
    "wl-clipboard"
    "udiskie"
    "nautilus"
    "gnome-keyring"
    "seahorse"

    # GUI-only extras
    "firefox"
)

# AUR — GUI-only
YAY_PACKAGES+=(
    "google-chrome"
)
