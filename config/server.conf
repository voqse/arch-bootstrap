#!/usr/bin/env bash
# arch-install role layer — server / headless
# Counterpart of desktop.conf: hosts opt in near the top of their preset:
#   source "${BASH_SOURCE[0]%/*}/server.conf"
# default.conf is already server-safe (no graphical packages); server-only
# additions belong here instead of being duplicated across host presets.

# Servers are administered over the network — enable sshd from the first
# boot (openssh itself is installed by default.conf on every machine;
# desktops enable sshd manually when needed).
SERVICES+=(
    "sshd"

    # Docker daemon autostart is a server trait: 24/7 compose stacks need
    # restart policies applied at boot, so the service itself is enabled on
    # top of the socket-activation that hooks/docker.sh sets up everywhere
    # (mirrors the station setup; desktops stay socket-activated on demand).
    "docker.service"
)
